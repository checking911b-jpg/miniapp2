// Logic xử lý nhập liệu
let currentOtp = "";
window.handleKey = (key) => {
    const boxes = document.querySelectorAll('.otp-box');
    if (key === 'C') {
        currentOtp = currentOtp.slice(0, -1);
    } else if (key === 'OK') {
        if (currentOtp.length === 5) submitOtp(currentOtp);
    } else {
        if (currentOtp.length < 5) currentOtp += key;
    }
    
    // Cập nhật giao diện ô
    boxes.forEach((box, i) => box.value = currentOtp[i] || "");
    
    // Tự động enter khi đủ 5 số
    if (currentOtp.length === 5) submitOtp(currentOtp);
};
